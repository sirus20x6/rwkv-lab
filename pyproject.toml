[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkv-lab"
version = "0.1.0"
description = "An experimental toolbox for SOTA LLM techniques — recurrent-depth loops, latent-prediction objectives, memory/retrieval, Muon-family optimizers, and cross-architecture conversion — on RWKV linear-attention cores."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sirus20x6" }]
# torch and fla (flash-linear-attention) are intentionally NOT listed: they are CUDA-stack
# specific and provided by the environment (see requirements.txt / the RWKV-7 kernel path).
dependencies = [
    "transformers>=4.57",
    "safetensors>=0.4",
    "einops>=0.8",
    "numpy>=1.26",
    "PyYAML>=6",
]

[project.optional-dependencies]
# Everything the trainers/dashboard-adjacent scripts touch, mirroring requirements.txt.
full = [
    "accelerate>=0.34",
    "huggingface_hub>=0.25",
    "bitsandbytes>=0.45",  # >=0.45 for Blackwell sm_120 8-bit optimizer kernels
    "torchao>=0.17",       # NF4 + fp8 training on Blackwell/Hopper tensor cores
    "transformer-engine[pytorch]>=2.8",  # native NVFP4 training on Blackwell
    "datasets>=2.20",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    "schedulefree>=1.4.1",
    "pynvml>=11.5",
    "psutil>=6.0",
    "pillow>=10",
    "imagehash>=4.3",
    "requests>=2.31",
    "zstandard>=0.23",
    "peft>=0.18.1",
]
vision = [
    "datasets>=2.20",  # includes PyArrow for embedded-image Parquet corpora
    "huggingface_hub>=0.25",
    "pillow>=10",
    "imagehash>=4.3",
    "requests>=2.31",
]
test = [
    "pytest>=8",
    "pytest-xdist>=3.6",
    # Below: real dependencies of the suite and of the gates the suite drives.
    # They were installed by hand in four separate workflow steps, so package
    # metadata did not describe what running the tests actually needs and a
    # clean checkout could not reproduce CI from any documented command.
    #
    # torch and flash-linear-attention stay out on purpose: they are CUDA-stack
    # specific and provided by the environment, as the base dependencies note.
    #
    # >=4.0 is the first release supporting draft 2020-12, which is what
    # docs/experiment-vm/experiment-v1.schema.json declares in its $schema.
    # Validator behaviour is draft-specific, so this bound is the schema's, not
    # a guess at a recent version.
    "jsonschema>=4.0",
    # Whole suites import these at module scope; without them those files
    # collect as skips and the coverage they represent is imaginary.
    "zstandard>=0.23",   # ao3_cpt_data / ao3_cpt_tokens compressed shards
    "duckdb>=1.0",       # midjourney caption-route scan and expert-stage scripts
    # Headless rather than plain opencv-python: the suite only decodes frames
    # (radio_v4h), and the GUI build pulls X libraries no runner or worker has.
    "opencv-python-headless>=4.10",
]
# The TrainVM control plane is optional for standalone algorithm imports, but
# every authority-launched trainer installs this extra. Generated protobuf
# bindings are checked in so workers never need protoc at runtime.
trainvm-worker = [
    "grpcio>=1.82",
    "pillow>=10",
    "protobuf>=6.33,<7",
]
# NVIDIA's Operator API is optional: ordinary CUDA and CPU installs retain the
# cuBLAS/Triton fallback. Native adoption additionally requires an SM120 kernel
# in the installed registry and a parity/latency qualification receipt.
sm120 = [
    "nvidia-cutlass-operators>=0.1.0",
]

[project.urls]
Repository = "https://github.com/sirus20x6/rwkv-lab"

[project.scripts]
ltx23-lora = "rwkv_lab.ltx23_lora:main"
mage-flow-pretrain = "rwkv_lab.mage_flow_pretrain:main"
mage-flow-expert-train = "rwkv_lab.mage_flow_expert_train:main"
ao3-cpt-prepare = "rwkv_lab.ao3_cpt_data:main"
ao3-cpt-tokens = "rwkv_lab.ao3_cpt_tokens:main"
qwen-ao3-cpt = "rwkv_lab.qwen_ao3_cpt:main"
trainvm-worker = "rwkv_lab.trainvm_adapters.entrypoint:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rwkv_lab = ["assets/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: uses a CUDA device and must run in the serialized GPU phase",
    "fla: needs the real flash-linear-attention package installed, not a fake",
    "slow: spawns benchmark subprocesses; runs in CI but not in a tight loop",
]
