name: tests

on:
  # Manual trigger, so a commit can be validated on demand rather than only as a
  # side effect of pushing. Without this a run that was cancelled could never be
  # re-run: twelve commits merged on 2026-08-09 lost their runs to concurrency
  # displacement and are still UNKNOWN rather than known-bad, because the only
  # way to ask for another run was to push again — which for merged history
  # means an empty commit. It also means a flake cannot be re-run against the
  # same tree to establish its rate; the ~34-42%-under-load race in
  # hostd_transport_tests had to be measured with a standalone probe for exactly
  # this reason.
  #
  # Note this trigger only appears in the Actions UI once the workflow file
  # containing it is on the default branch, so it cannot be exercised from the
  # pull request that adds it. Its absence before merge is expected.
  workflow_dispatch:
  push:
    branches: [main, dashboard/declarative-vm-fsm]
  pull_request:

# Cancel superseded PR runs, never branch-push runs.
#
# A second push to a pull request supersedes the first: the earlier run is
# testing code nobody will merge, so cancelling it is free. Two pushes to a
# BRANCH are not supersessions — each validates a different commit, and on main
# each of those commits is one somebody already merged. Cancelling there does
# not save work, it discards the only run positioned to catch a semantic
# conflict between two pull requests that each passed against their own base.
#
# That is not theoretical. On 2026-08-09, eight merges in about ninety minutes
# left four of the last six main commits with no validation at all — c0433c0,
# f311dfa, 26fd8c6 and f25d5cf were each cancelled by the merge that followed.
# In the same window PR #91 failed on main's newer content while passing on its
# own base, which is exactly the class this discards.
#
# Keyed on the event rather than the branch name because `push` also covers
# dashboard/declarative-vm-fsm, whose runs are equally not supersessions.
#
# Not cancelling was necessary but not sufficient. A concurrency group holds at
# most one PENDING run, and that displacement is not governed by
# cancel-in-progress: a newer arrival evicts the queued one regardless. So the
# group must also differ per commit for pushes, or a merge landing while the
# previous main run is still going still loses a commit's validation.
#
# The triggering condition is common rather than exceptional. A main run takes
# 8-14 minutes, so ANY two merges closer together than that queue the second and
# drop the first. Measured on 2026-08-09: #117 and #113 merged three seconds
# apart while a9edb82's run was still in progress, and 9135b44's queued run was
# evicted — after the cancel-in-progress fix was already in place.
#
# For a pull request the group stays per-PR, because there a second push really
# does supersede the first and cancelling is free.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Fails when a test file contributes nothing to the CPU run and does not say
  # why. This is what stops the suite from silently shrinking again: the
  # previous workflow ran a hand-maintained list of 36 files out of 119, two of
  # which contained no test functions at all.
  coverage-gate:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch + package)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # The test extra carries the module-scope optional dependencies
          # (jsonschema, zstandard, duckdb, opencv-python-headless) that whole
          # suites import, so this single line is what makes the extra coverage
          # real rather than a directory full of skips.
          pip install -e '.[vision,test,trainvm-worker]'
      - name: Every test file is covered or explicitly excluded
        # Masked like every other non-GPU invocation. These runners have no GPU,
        # so this cannot fail here -- it is kept identical to the local command
        # on purpose, because a CI recipe that diverges from the one developers
        # run is the reason the original defect was invisible to CI.
        run: python scripts/non_gpu_environment.py python scripts/ci_coverage_gate.py -m "not gpu"

      # The mirror image of the step above, and it lives here for the same
      # reason: this is the only job that installs enough to collect the whole
      # suite. The coverage gate asks whether a test file contributes anything
      # to the run; this one asks whether a gpu-marked test -- which contributes
      # nothing to any hosted run, because vars.TRAINVM_SELF_HOSTED is unset and
      # the gpu job below reports "skipping" -- has any record of ever having
      # run anywhere. A skip is green, so without the receipt those two states
      # are the same colour.
      #
      # Masked like every other non-GPU invocation. Collection needs no device,
      # which is the point: this is provable on a runner that has none.
      - name: Every gpu-marked test has an observation entry
        run: python scripts/non_gpu_environment.py python scripts/ci_gpu_observation_gate.py

  python-cpu:
    name: CPU tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install (CPU torch + package)
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch (no CUDA on the runner); the RWKV-7 kernel falls back to the
          # pure-Python reference (RWKV8_FORCE_PYREF, set by tests/conftest.py), so `fla`
          # is not required. A test needing an optional dependency must importorskip it.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Vision extras cover the embedded-image corpus and deduplication
          # utilities exercised by the multimodal CPU tests; trainvm-worker
          # supplies the protobuf runtime the TrainVM worker suites import.
          # The test extra carries the module-scope optional dependencies
          # (jsonschema, zstandard, duckdb, opencv-python-headless) that whole
          # suites import, so this single line is what makes the extra coverage
          # real rather than a directory full of skips.
          pip install -e '.[vision,test,trainvm-worker]'

      # The whole non-GPU suite, not a named subset. A test that needs an
      # optional dependency skips itself; it does not get dropped from CI.
      - name: Run the full non-GPU suite
        run: |
          mkdir -p evidence
          python scripts/non_gpu_environment.py \
            python -m pytest -q -n auto --dist worksteal -m "not gpu" tests \
            --junitxml=evidence/python-cpu-${{ matrix.python }}.xml

      # What the run above did not do. The coverage gate catches a test file
      # that contributes nothing and the native exclusion pin catches a suite
      # that stops running; a collected file whose tests all skip at runtime
      # passes both, so `1264 passed, 10 skipped` could become
      # `1000 passed, 274 skipped` with every gate green. Reads the JUnit XML
      # the step above just wrote -- never the terminal report -- and fails on
      # a skip reason that is not declared in
      # docs/experiment-vm/skip-reason-baseline.v1.json, or on a count over
      # the bound pinned there for this runner.
      #
      # if: always() so a failing suite still gets its skip receipt. The two
      # answer different questions and a red suite is exactly when "what else
      # stopped running?" is worth asking.
      - name: Runtime skips are declared and within the pinned bound
        if: always()
        run: |
          python scripts/ci_skip_reason_gate.py \
            evidence/python-cpu-${{ matrix.python }}.xml \
            --environment github-hosted-cpu \
            --receipt evidence/skip-receipt-python-cpu-${{ matrix.python }}.json

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-python-cpu-${{ matrix.python }}
          path: evidence/
          if-no-files-found: warn

  # The CPU job above deliberately omits flash-linear-attention, so any test
  # asserting against the *real* package importorskips itself there. That skip
  # is only honest if the assertion still runs somewhere, otherwise the suite
  # keeps a test it never executes. This job installs the real dependency and
  # runs exactly the `fla`-marked tests.
  #
  # No hand-maintained file list: selection is by marker, and pytest exits 5
  # ("no tests collected") if the marker is ever dropped, so deleting the
  # coverage fails this job instead of passing quietly.
  python-fla:
    name: fla dependency tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (CPU torch + package + flash-linear-attention)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Marker selection still imports every test module during
          # collection, so this job needs the same module-scope optional
          # dependencies as the CPU job even though it runs only the fla-marked
          # tests. The test extra supplies them.
          pip install -e '.[vision,test,trainvm-worker]'
          # The real dependency this job exists to exercise. It is a CUDA-stack
          # package, but importing it and driving its Cache type works on CPU.
          pip install flash-linear-attention

      - name: The fla-marked assertions run against the installed package
        run: |
          mkdir -p evidence
          python scripts/non_gpu_environment.py \
            python -m pytest -q -m "fla and not gpu" tests \
            --junitxml=evidence/python-fla.xml

      # This job exists to run assertions the CPU job skips, so a skip HERE is
      # the coverage draining out of the one place that catches it.
      - name: Runtime skips are declared and within the pinned bound
        if: always()
        run: |
          python scripts/ci_skip_reason_gate.py evidence/python-fla.xml \
            --environment github-hosted-fla \
            --receipt evidence/skip-receipt-python-fla.json

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-python-fla
          path: evidence/
          if-no-files-found: warn

  schema-golden:
    name: Schema and example documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # jsonschema comes from the test extra rather than a bare install, so
      # the version the gate validates against is declared in one place.
      - run: pip install -e '.[test]'
      - name: Example experiment documents match the checked-in schema
        run: python scripts/validate_experiment_documents.py
      - name: Benchmark fixtures match the qualification contract
        run: python scripts/validate_benchmark_matrix.py

      # Runs here rather than in the native job so the pin is checked even when
      # the native job is skipped or cannot start: a drifting exclusion set is
      # exactly the thing a missing native run would otherwise hide.
      - name: Native ctest exclusions are declared and pinned
        run: python scripts/validate_native_ci_exclusions.py

      # Runs here, in the seconds-fast Python job, because it needs no compiler:
      # it reads the #include graph out of the source text. That is deliberate
      # -- the native job takes an ~8 minute GCC 16 build and is skipped or
      # unable to start often enough that a gate living only there is a gate
      # that often does not run. This one reports on every pull request.
      #
      # It fails rather than warns. Four fully-implemented, fully-tested,
      # green modules with zero production callers survived in this repository
      # in a single session; a non-blocking signal for something that already
      # got past careful review four times would be ignored.
      - name: Every native module has a production includer or an explained exclusion
        run: python scripts/ci_unwired_module_gate.py

      # Same reasoning again, applied to the figures COMPATIBILITY_CATALOG.md
      # states about the catalog beside it. One of them ("145 unique source
      # files") had been wrong by ten for an unknown length of time, in a
      # sentence whose other number was right because that one is a compiled
      # array length. Here rather than in the native suite because the pull
      # request that gets this wrong is a documentation edit, which is the one
      # least likely to be waiting on an eight-minute C++26 build.
      - name: Figures stated in the compatibility catalog document are true
        run: python scripts/ci_catalog_doc_counts_gate.py

      # Same reasoning again, applied to the step-zero arming table. The pull
      # request that changes an arming answer is usually a JSON edit to a
      # recipe-profile catalog under docs/experiment-vm/examples/, which is the
      # one least likely to be waiting on the native build -- and the
      # native-change-scope classifier can skip that build entirely for a
      # docs-only change, so a gate living only there would not run at all on
      # exactly the change that breaks the table.
      #
      # The registry half is pinned (ctest step_zero_arming_pin checks the pin
      # against a real build); the composition half is recomputed here from the
      # documents, which needs no compiler and no torch. The pin's route set is
      # compared against the worker's dispatch table in the CPU job instead --
      # importing that table pulls in torch, which this job deliberately does
      # not install.
      - name: The step-zero arming table describes the repository
        run: python scripts/ci_step_zero_arming_gate.py

      # Same reasoning, applied to the source-disposition pins. The native
      # suite already enforces them, but only after an ~8 minute toolchain and
      # C++26 build; this reports the same drift in seconds and keeps reporting
      # it if the native job is skipped or cannot start.
      #
      # It matters most for a Python-only change: every classified source under
      # src/rwkv_lab is content-pinned, so editing one moves a disposition
      # digest, and that is exactly the pull request least likely to be waiting
      # on a native build.
      - name: Source disposition pins match the files on disk
        run: |
          for catalog in docs/experiment-vm/source-dispositions.*.v1.json; do
            python scripts/print_disposition_digests.py "$catalog" --check
          done

      # The same argument, now for the catalog whose pins had no cheap check at
      # all. The native loader enforces them and enforces them well -- it fails
      # closed and names the file -- but on PR #186 it said so at step 98 of 99,
      # after 85 translation units had compiled and the executable had linked.
      # Comparing 155 sha256 values against a stored list is sub-second work,
      # and it was reachable only through an 8-14 minute C++26 build that the
      # PR-tier classifier can skip entirely.
      #
      # It checks the per-source pins only. Neither fold -- the source tree
      # digest nor the classification surface digest -- is recomputed here:
      # both stay the C++ implementation's business, because a Python mirror of
      # a C++ fold is a second implementation that has to be kept in agreement
      # with the first, and PR #180 already paid that cost on the disposition
      # catalogs. Nothing is lost, since both folds are computed from the same
      # file bytes this gate hashes.
      - name: Compatibility catalog source pins match the files on disk
        run: python scripts/ci_compatibility_pin_gate.py

  # The four generated protobuf bindings are committed, and until this job
  # existed nothing compared them against proto/trainvm/v1/trainvm.proto. They
  # drifted: `GetReconciliationStatus` was added to the service and neither grpc
  # stub was regenerated, so the Go client had no method and the Python servicer
  # no handler, for an unknown period, with every job below green. Neither
  # language reports that as a build error -- the stubs compile fine, they are
  # just missing something -- so this job regenerates and diffs the bytes rather
  # than merely building them.
  #
  # The generator versions live in the script, not here, so the local command and
  # the CI command cannot disagree about what "current" means. The script fetches
  # protoc at its pinned release (verified by sha256) and `go install`s the two
  # pinned plugins; this job supplies only Go, Python and uv. Each generator
  # stamps its version into the header of the file it emits, which is why they
  # are pinned at all: an unpinned generator turns every toolchain upgrade into a
  # diff indistinguishable from real drift, and a gate that cries wolf on a
  # runner upgrade is a gate somebody deletes.
  proto-bindings:
    name: Generated proto bindings match the proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: dashboard/go.mod
          cache-dependency-path: dashboard/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # uv only launches the pinned grpcio-tools; the bindings it produces are
      # fixed by that pin, so uv's own version does not affect the output.
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
      - name: Regenerating from the proto reproduces what is committed
        run: scripts/generate_trainvm_proto.sh --check

  go:
    name: Dashboard (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: dashboard/go.mod
          cache-dependency-path: dashboard/go.sum
      - name: Build and vet
        working-directory: dashboard
        run: |
          go build ./...
          go vet ./...
      # TRAINVM_E2E_BINARY is unset here, so the live-stack E2E skips. It runs
      # in the native job, which has a built trainvm binary.
      - name: Test
        working-directory: dashboard
        run: go test ./... 2>&1 | tee ../evidence-go.txt
      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-go
          path: evidence-go.txt
          if-no-files-found: warn

  # Decide how much native work this change honestly needs. The classifier is
  # fail-closed: an unfamiliar path selects the full suite, never a skip.
  # Pushes to main always run full native acceptance; tiering is only a PR
  # turnaround optimization.
  native-change-scope:
    name: Native change scope
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Classify changed paths (fail closed)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # pipefail matters here rather than being boilerplate. GitHub runs
          # this with `bash -e`, not `-o pipefail`, so a crashed classifier
          # piped into tee would exit 0, emit no `mode=` line, and leave the
          # output empty -- which reads as "not full" downstream and would have
          # quietly demoted the tier. The classifier failing must be red.
          set -euo pipefail
          mkdir -p evidence
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python scripts/classify_native_ci_changes.py \
              --base "$BASE_SHA" --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT" | tee evidence/native-change-scope.json
          else
            receipt='{"api_version":"trainvm.native-ci-change-scope/v1","mode":"full","paths":[{"mode":"full","path":"<push-to-main>","reason":"main integration always runs full native acceptance"}]}'
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "$receipt" | tee evidence/native-change-scope.json
          fi
          # The job output is a string a later `if:` compares against; assert
          # it is one of the three known values rather than trusting that it is.
          emitted="$(grep '^mode=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"
          case "$emitted" in
            none|catalog|full) echo "selected native tier: $emitted" ;;
            *) echo "classifier emitted no usable mode ($emitted)" >&2; exit 1 ;;
          esac
      - name: Publish classification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-native-change-scope
          path: evidence/
          if-no-files-found: error

  # TrainVM needs GCC 16 with -freflection (C++26 P2996) and a set of
  # dependencies no stock image provides together. The job builds its own
  # toolchain image from .github/docker/trainvm-ci.Dockerfile and caches the
  # layers, so it needs no registry, no package permissions, and no
  # self-hosted runner. Every PR either runs the full suite, builds the real
  # CLI for catalog/adapter-contract validation, or publishes a fail-closed
  # receipt proving that its paths are covered by another job.
  #
  # Building rather than pulling is deliberate: a registry image has to be
  # published, made visible to this repository, and kept in step with the
  # Dockerfile. Every one of those is a way for CI to drift from the source it
  # claims to test. The cache makes the cost a first-run one.
  native:
    # Keep the check name stable for branch-protection rules; the selected mode
    # is recorded in the scope/timing artifacts and build-step log.
    name: TrainVM native (ctest)
    needs: native-change-scope
    runs-on: ubuntu-latest
    steps:
      - name: No native build required
        if: ${{ needs.native-change-scope.outputs.mode == 'none' }}
        run: echo 'All changed paths are covered by the Python, schema, or Go jobs.'

      - uses: actions/checkout@v4
        if: ${{ needs.native-change-scope.outputs.mode != 'none' }}

      - uses: docker/setup-buildx-action@v3
        if: ${{ needs.native-change-scope.outputs.mode != 'none' }}

      # The Dockerfile ends in a smoke test over the whole toolchain contract,
      # so a broken image fails here rather than as an unexplained red suite.
      - name: Build toolchain image
        if: ${{ needs.native-change-scope.outputs.mode != 'none' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/trainvm-ci.Dockerfile
          load: true
          tags: trainvm-ci:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Object compilation happens after docker build, so BuildKit's layer
      # cache cannot help it. Restore a bounded compiler cache separately.
      - name: Restore native compiler cache
        if: ${{ needs.native-change-scope.outputs.mode != 'none' }}
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/trainvm-ccache
          key: trainvm-ccache-v1-${{ runner.os }}-${{ hashFiles('.github/docker/trainvm-ci.Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            trainvm-ccache-v1-${{ runner.os }}-${{ hashFiles('.github/docker/trainvm-ci.Dockerfile') }}-

      # The source is copied into the container rather than built in the mount:
      # the live-stack E2E requires an authority directory whose whole ancestry
      # is unwritable by others, and CMake derives TRAINVM_E2E_AUTHORITY_DIR
      # from the binary directory.
      #
      # 63 of 67 suites run. Four are excluded because they fail on a GitHub
      # hosted runner specifically -- not merely "in a container". They pass in
      # this same image locally, including under a 4-core cpuset and full ctest
      # contention, so the difference is the runner's kernel and sandbox rather
      # than the image or the core count. That was checked before excluding
      # them, and the exclusions were briefly removed and re-confirmed against
      # a real CI run rather than assumed:
      #
      #   hostd_linux_session_authority_tests  pins the session procfs with
      #     openat2, which the hosted sandbox does not permit
      #   host_resources_tests                 asserts inventory/occupancy
      #     digests built from a real host
      #   trainvm_dashboard_live_e2e           spawns the live stack
      #   rwkv_lab_worker_artifact             builds a sealed worker artifact
      #
      # All four are covered by scripts/acceptance.sh on a real host, which is
      # where they are meaningful. Read "covered" as runnable, not running:
      # nothing schedules that script. No workflow invokes it, there is no
      # Makefile, and nothing in CMake calls it -- it runs when a person types
      # the command. This comment used to say the four "run in" acceptance,
      # which read as a cadence that did not exist.
      #
      # scripts/acceptance.sh now appends one line per run to
      # docs/experiment-vm/acceptance-attestations.v1.jsonl, recording the
      # commit, the host, the time, and each of these four suites pass or fail.
      # Failures are appended too, so an absent line means "never run" and
      # nothing else. To find out whether these four have been checked against
      # anything close to current main:
      #
      #   tail -1 docs/experiment-vm/acceptance-attestations.v1.jsonl
      #   git log --oneline <that commit>..origin/main | wc -l
      #
      # An empty log, or a commit hundreds behind, means these suites are
      # unchecked right now -- by this job, which excludes them, and by
      # acceptance, which nobody ran. Nothing fails on a stale attestation
      # deliberately: no hosted runner can produce one, so the check could only
      # ever be red, and see below for why that is the outcome to avoid.
      #
      # Excluding them still keeps this job a signal: a permanently red job is
      # one everybody learns to ignore.
      #
      # An exclusion still costs coverage, though, so it is worth checking what
      # rides along inside an excluded test. rwkv_lab_worker_artifact also held
      # the adapter-set pin, which needs only the binary — so an adapter was
      # added and the pin stayed stale for hours because the only thing that
      # checked it never ran on a pull request. That pin now lives in
      # rwkv_lab_runtime_requirements, which is not excluded. Before excluding
      # anything else, split out whatever part of it does not need the thing
      # that forced the exclusion.
      # The set above is pinned by docs/experiment-vm/native-ci-exclusions.v1.json
      # and checked by scripts/validate_native_ci_exclusions.py in the
      # schema-golden job, so it cannot grow without a stated reason.
      - name: State which suites this job does not run
        if: ${{ needs.native-change-scope.outputs.mode != 'none' && needs.native-change-scope.outputs.mode != 'catalog' }}
        run: python scripts/validate_native_ci_exclusions.py

      - name: Build and validate selected native tier
        if: ${{ needs.native-change-scope.outputs.mode != 'none' }}
        env:
          NATIVE_CI_MODE: ${{ needs.native-change-scope.outputs.mode }}
        run: |
          mkdir -p "${RUNNER_TEMP}/trainvm-ccache" evidence
          chmod 0777 "${RUNNER_TEMP}/trainvm-ccache" evidence
          docker run --rm \
            -e NATIVE_CI_MODE \
            -e CCACHE_DIR=/ccache \
            -e CCACHE_BASEDIR=/build \
            -e CCACHE_COMPILERCHECK=content \
            -e CCACHE_MAXSIZE=1G \
            -v "${RUNNER_TEMP}/trainvm-ccache":/ccache \
            -v "$PWD":/w:ro \
            -v "$PWD/evidence":/evidence \
            trainvm-ci:ci bash -euo pipefail -c '
            started=$(date +%s)
            cp -a /w /build && chown -R root:root /build && cd /build
            ccache --zero-stats
            cmake -S trainvm -B b -G Ninja -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build b --target trainvm -j "$(nproc)"
            ./b/trainvm validate-catalog \
              /build/docs/experiment-vm/compatibility-workflows.v1.json /build
            PYTHONPATH=/build/src /opt/venv/bin/python \
              trainvm/tests/verify_rwkv_lab_worker_contract.py ./b/trainvm
            PYTHONPATH=/build/src /opt/venv/bin/python \
              trainvm/tests/verify_rwkv_lab_runtime_requirements.py ./b/trainvm
            # Written as "not catalog" rather than "is full" on purpose: every
            # comparison that decides to do LESS work is spelled against the
            # narrow tier, so an unexpected mode string buys the full suite.
            if [[ "$NATIVE_CI_MODE" != "catalog" ]]; then
              cmake --build b -j "$(nproc)"
              ctest --test-dir b -j 4 --output-on-failure \
                -E "^(hostd_linux_session_authority_tests|host_resources_tests|trainvm_dashboard_live_e2e|rwkv_lab_worker_artifact)$"
            fi
            ccache --show-stats > /evidence/ccache.txt
            elapsed=$(($(date +%s) - started))
            printf "{\"api_version\":\"trainvm.native-ci-timing/v1\",\"elapsed_seconds\":%s,\"mode\":\"%s\"}\n" \
              "$elapsed" "$NATIVE_CI_MODE" > /evidence/native-ci-timing.json
          '

      - name: Save native compiler cache
        if: ${{ success() && needs.native-change-scope.outputs.mode != 'none' && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/trainvm-ccache
          key: trainvm-ccache-v1-${{ runner.os }}-${{ hashFiles('.github/docker/trainvm-ci.Dockerfile') }}-${{ github.sha }}

      - name: Publish native timing and cache evidence
        if: ${{ always() && needs.native-change-scope.outputs.mode != 'none' }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence-native-${{ needs.native-change-scope.outputs.mode }}
          path: evidence/
          if-no-files-found: warn

  # GPU tests share one device. The concurrency group is intentionally global
  # rather than per-ref, so two branches cannot run CUDA suites at the same
  # time and blame each other's allocator failures. cancel-in-progress is false
  # so a running GPU suite finishes instead of being killed mid-device.
  gpu:
    name: GPU tests (serialized)
    if: ${{ vars.TRAINVM_SELF_HOSTED == 'true' }}
    runs-on: [self-hosted, linux, gpu]
    concurrency:
      group: gpu-tests
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Run GPU-marked suite
        run: |
          mkdir -p evidence
          # The only invocation in this workflow that authorizes a device.
          TRAINVM_TEST_ACCELERATOR_ACCESS=1 \
            python -m pytest -q -m gpu tests --junitxml=evidence/gpu.xml
      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-gpu
          path: evidence/
          if-no-files-found: warn
