name: ci-image

# Builds and publishes the TrainVM native toolchain image.
#
# The image is built by a workflow rather than pushed by hand so it is
# reproducible: the Dockerfile in this repository is the only definition, and
# anyone can see exactly what the native job is compiling against. A
# hand-pushed image would drift from the repo silently.
#
# It rebuilds only when its own definition changes, plus a weekly run so
# security updates in the base image land without waiting for a Dockerfile edit.
# Everything inside is version-pinned, so a rebuild changes the base layer and
# nothing else.

on:
  push:
    branches: [main, dashboard/declarative-vm-fsm]
    paths:
      - .github/docker/trainvm-ci.Dockerfile
      - .github/workflows/ci-image.yml
  schedule:
    # 04:17 on Mondays. Off the hour on purpose: every scheduled job in the
    # world fires at :00.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish toolchain image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile's own smoke test (reflection compiles, both CMake config
      # packages present, protoc and grpc_cpp_plugin executable, Go and Python
      # present) runs as a build step, so a broken toolchain fails here rather
      # than surfacing as an unexplained red native job later.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/trainvm-ci.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/trainvm-ci:latest
            ghcr.io/${{ github.repository_owner }}/trainvm-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
